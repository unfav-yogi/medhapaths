<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDHAPATH — Digital Certificate Verification</title>
<link rel="icon" type="image/png" href="/static/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Alex+Brush&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --ink: #10151F;
    --ink-raised: #171E2C;
    --ink-line: #2A3244;
    --brass: #C9A24B;
    --brass-deep: #8C6C28;
    --parchment: #F5EFE1;
    --parchment-line: #C9BB92;
    --success: #3F8F5F;
    --success-bg: #173324;
    --danger: #BD5142;
    --danger-bg: #331A16;
    --slate: #8B93A6;
    --slate-light: #B7BECC;
    --white: #F7F5EF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--ink); }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--white);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  #app { display: flex; flex-direction: column; min-height: 100vh; width: 100%; }
  ::selection { background: var(--brass); color: var(--ink); }
  a { color: inherit; }
  input, select, textarea, button { font-family: inherit; }
  .font-display { font-family: 'Fraunces', serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  .max-w-6xl { max-width: 1152px; margin: 0 auto; width: 100%; }
  .max-w-5xl { max-width: 960px; margin: 0 auto; width: 100%; }
  .max-w-3xl { max-width: 768px; margin: 0 auto; width: 100%; }
  .max-w-sm { max-width: 384px; margin: 0 auto; width: 100%; }
  .max-w-lg { max-width: 512px; margin: 0 auto; width: 100%; }
  .px-20 { padding-left: 20px; padding-right: 20px; }
  .card {
    background: var(--ink-raised);
    border: 1px solid var(--ink-line);
    border-radius: 12px;
    padding: 18px;
  }
  .pill {
    font-size: 11px; color: var(--brass);
    border: 1px solid var(--brass-deep); border-radius: 999px; padding: 3px 9px;
    display: inline-block;
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--brass); color: var(--ink); font-weight: 600; font-size: 14.5px;
    padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer;
  }
  .btn-primary:disabled { opacity: .6; cursor: default; }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 8px;
    background: transparent; color: var(--white); font-weight: 500; font-size: 14.5px;
    padding: 12px 20px; border-radius: 8px; border: 1px solid var(--ink-line); cursor: pointer;
  }
  .input {
    width: 100%; background: var(--ink); border: 1px solid var(--ink-line);
    border-radius: 8px; padding: 10px 12px; color: var(--white); font-size: 14px; outline: none;
  }
  .section-eyebrow { font-size: 12px; color: var(--brass); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .section-title { font-family: 'Fraunces', serif; font-size: 27px; font-weight: 600; }
  .grid-auto { display: grid; grid-template-columns: 1fr; gap: 20px; }
  .grid-2 { grid-template-columns: 1fr; }
  .grid-2-3 { grid-template-columns: 1fr; }
  .grid-2-4 { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: 1fr; }
  .grid-2-md { grid-template-columns: 1fr; }
  @media (min-width: 640px) {
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-2-3 { grid-template-columns: repeat(2, 1fr); }
    .grid-2-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 768px) {
    .grid-2-md { grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 1024px) {
    .grid-2-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-2-4 { grid-template-columns: repeat(4, 1fr); }
  }
  .nav-desktop { display: none; align-items: center; gap: 24px; }
  .nav-toggle { display: flex; }
  .nav-mobile { display: flex; flex-direction: column; }
  @media (min-width: 768px) {
    .nav-desktop { display: flex; }
    .nav-toggle { display: none; }
    .nav-mobile { display: none; }
  }
  .footer-flex { display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 12px; }
  @media (min-width: 640px) { .footer-flex { flex-direction: row; } }
  .admin-shell { display: flex; flex-direction: column; }
  .admin-sidebar { display: flex; flex-direction: row; align-items: stretch; overflow-x: auto; flex-shrink: 0; width: 100%; gap: 4px; }
  .admin-sidebar button { flex-shrink: 0; }
  @media (min-width: 768px) {
    .admin-shell { flex-direction: row; }
    .admin-sidebar { flex-direction: column; width: 224px; overflow-x: visible; }
  }
  .tab-btn {
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
    padding: 10px 12px; border-radius: 8px; background: transparent; border: none;
    color: var(--slate-light); font-size: 13.5px; cursor: pointer; text-align: left;
  }
  .tab-btn.active { background: var(--ink-raised); color: var(--brass); }
  .admin-list-box { border: 1px solid var(--ink-line); border-radius: 10px; overflow: hidden; }
  .admin-list-box > div:last-child { border-bottom: none !important; }
  @media print {
    body * { visibility: hidden; }
    #printable-cert, #printable-cert * { visibility: visible; }
    #printable-cert { position: absolute; top: 0; left: 0; width: 100%; }
  }

  /* ---------------- Splash / loading screen ---------------- */
  #splash-screen {
    position: fixed; inset: 0; z-index: 9999;
    background: radial-gradient(circle at 50% 35%, #171E2C, #10151F 70%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 28px;
    transition: opacity .7s ease, visibility .7s ease;
  }
  #splash-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .splash-scene { position: relative; width: 220px; height: 150px; }
  .splash-bench {
    position: absolute; left: 0; bottom: 0; width: 220px; height: 40px;
    animation: splash-fade-in .6s ease both;
  }
  .splash-figure {
    position: absolute; left: 0; bottom: 22px; width: 220px; height: 140px;
    animation: splash-fade-in .6s ease .1s both, splash-sway 3.2s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  .splash-book {
    position: absolute; left: 80px; bottom: 44px; width: 60px; height: 24px;
    perspective: 200px; z-index: 2;
    animation: splash-fade-in .6s ease .2s both;
  }
  .splash-book-half {
    position: absolute; top: 0; width: 30px; height: 24px; background: #F5EFE1;
    border: 1px solid #C9BB92;
  }
  .splash-book-half.left { left: 0; border-radius: 3px 0 0 3px; }
  .splash-book-half.right { right: 0; border-radius: 0 3px 3px 0; }
  .splash-page {
    position: absolute; top: 0; right: 0; width: 30px; height: 24px;
    background: #FBF7EC; border: 1px solid #C9BB92; border-radius: 0 3px 3px 0;
    transform-origin: left center; box-shadow: -2px 0 4px rgba(0,0,0,0.15);
    animation: splash-turn-page 1.4s ease-in-out infinite;
  }
  @keyframes splash-turn-page {
    0%   { transform: rotateY(0deg); }
    35%  { transform: rotateY(-160deg); }
    55%  { transform: rotateY(-160deg); }
    90%  { transform: rotateY(0deg); }
    100% { transform: rotateY(0deg); }
  }
  @keyframes splash-sway {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(0.8deg); }
  }
  @keyframes splash-fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .splash-quote { text-align: center; padding: 0 24px; max-width: 380px; animation: splash-fade-in .8s ease .3s both; }
  .splash-quote-text { font-size: 17px; font-style: italic; color: var(--white); line-height: 1.5; }
  .splash-brand { margin-top: 14px; font-size: 12px; letter-spacing: 3px; color: var(--brass); text-transform: uppercase; }

  /* ---------------- Floating page stickers ---------------- */
  .sticker {
    position: absolute; pointer-events: none; opacity: 0.5;
    animation: sticker-float 5s ease-in-out infinite;
  }
  .sticker.delay1 { animation-delay: .6s; }
  .sticker.delay2 { animation-delay: 1.2s; }
  @keyframes sticker-float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-14px) rotate(6deg); }
  }
</style>
</head>
<body>
<div id="splash-screen">
  <div class="splash-scene">
    <svg class="splash-bench" viewBox="0 0 220 40" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="14" width="200" height="7" rx="2" fill="#3A331F"/>
      <rect x="10" y="24" width="200" height="4" rx="2" fill="#2A2416"/>
      <rect x="24" y="28" width="7" height="12" fill="#171E2C"/>
      <rect x="189" y="28" width="7" height="12" fill="#171E2C"/>
    </svg>
    <svg class="splash-figure" viewBox="0 0 220 140" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="100" cy="118" rx="34" ry="10" fill="#171E2C" opacity="0.5"/>
      <path d="M76 64 Q72 106 80 118 L120 118 Q128 106 124 64 Z" fill="#C9A24B"/>
      <circle cx="100" cy="44" r="17" fill="#E8C79A"/>
      <path d="M83 38 Q100 24 117 38 Q116 28 100 28 Q84 28 83 38 Z" fill="#171E2C"/>
      <path d="M76 118 Q74 132 68 136" stroke="#171E2C" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M124 118 Q126 132 132 136" stroke="#171E2C" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M82 76 Q66 92 76 100" stroke="#C9A24B" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M118 76 Q134 92 124 100" stroke="#C9A24B" stroke-width="8" stroke-linecap="round" fill="none"/>
    </svg>
    <div class="splash-book">
      <div class="splash-book-half left"></div>
      <div class="splash-book-half right"></div>
      <div class="splash-page"></div>
    </div>
  </div>
  <div class="splash-quote">
    <div class="font-display splash-quote-text">"Every page turned is a step further on the path."</div>
    <div class="splash-brand">MEDHAPATH</div>
  </div>
</div>
<div id="app"></div>
<script src="/static/app.js"></script>
</body>
</html>
