services:
  - type: web
    name: medhapath
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: medhapath-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
